name: CI

# docs/07 § Deployment flow step 1: "CI builds and tests each service."
# This is the gate everything in this repo has been verified against
# locally (pnpm typecheck / lint / test) — running it in CI is what makes
# that verification apply to every future change, not just the one that
# happened to be run by hand.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repo or to PRs; checkout is the only token use.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (typecheck, lint, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Setting this is what turns the DB-backed integration suites on: they
      # self-skip (and still report green) when it is unset. The credentials
      # are for the throwaway service container below, which only exists for
      # the duration of this job and is not reachable from outside it, so
      # they are not secrets.
      ATLAS_TEST_DATABASE_URL: postgres://atlas:atlas@localhost:5432/atlas_test

    services:
      # Same image as docker-compose.yml (pgvector bundled; pg_trgm and
      # pgcrypto ship with Postgres contrib). The user is the container's
      # superuser, which migrate.ts needs for CREATE EXTENSION.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_test
        ports:
          - 5432:5432
        # -h 127.0.0.1 forces a TCP check. During first start the image runs a
        # temporary server that listens only on a unix socket; a socket check
        # would report healthy too early and the next step would get
        # "connection refused" while the real server restarts.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U atlas -d atlas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Scoped to packages/* and services/* (see tsconfig.json) — apps/web
      # and apps/admin have their own bundler-based typecheck below, since
      # they use a different module resolution than the backend.
      - name: Typecheck (backend)
        run: pnpm typecheck

      - name: Lint (whole repo)
        run: pnpm lint

      # Supabase is not available here, so this applies a minimal stand-in
      # (roles + auth.users; infra/ci/supabase-stub.sql), then the real
      # migrations, then packages/db/supabase/auth-hooks.sql. The same script
      # works locally: see its header.
      - name: Prepare test database (Supabase stand-in, migrations, auth hooks)
        env:
          DATABASE_URL: ${{ env.ATLAS_TEST_DATABASE_URL }}
        run: bash scripts/ci/setup-test-db.sh

      - name: Test (backend, including DB-backed integration suites)
        run: pnpm test

  frontend:
    name: Frontend (typecheck, build)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ['@atlas/web', '@atlas/admin']
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter ${{ matrix.app }} run typecheck

      # `next build` catches bundler-resolution issues typecheck alone
      # doesn't (see the "wip"/"fix" commit history on apps/web for exactly
      # what that class of bug looks like here).
      #
      # SessionProvider builds a Supabase browser client eagerly, including
      # during static generation of /_not-found — so these must be set even
      # though nothing in this build actually calls Supabase. They're the
      # publishable anon key and project URL (meant to ship in client JS),
      # not secrets, so a real value here is safe.
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://qkqllkfgxsmhjintkqfm.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_DGb1kAEeNl_w2Tbk9gT2rA_M75FcXhv
        run: pnpm --filter ${{ matrix.app }} run build
